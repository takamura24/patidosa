apiVersion: apps/v1
kind: Deployment
metadata:
  name: patidosa
  labels:
    app: patidosa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patidosa
  template:
    metadata:
      labels:
        app: patidosa
    spec:
      containers:
        - name: patidosa
          image: <dockerhub-username>/patidosa:latest   # replace before applying
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
