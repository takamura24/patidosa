<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pati Dosa Batter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fdf6ec;
    color: #3a2a1a;
    min-height: 100vh;
  }
  header {
    background: #b5461a;
    color: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1.3rem; font-weight: 600; }
  header .tagline { font-size: 0.75rem; opacity: 0.85; }
  #cart-btn {
    position: relative;
    background: #fff;
    color: #b5461a;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  #cart-count {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #2f7d32;
    color: #fff;
    font-size: 0.7rem;
    min-width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px;
  }
  main > p.intro {
    text-align: center;
    color: #6b5744;
    margin-bottom: 28px;
  }
  .products {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 520px) {
    .products { grid-template-columns: 1fr; }
  }
  .product-card {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    text-align: center;
  }
  .product-card .emoji {
    font-size: 2.6rem;
    margin-bottom: 8px;
  }
  .product-card h3 {
    font-size: 1.05rem;
    margin-bottom: 4px;
  }
  .product-card .price {
    font-size: 1.15rem;
    font-weight: 700;
    color: #b5461a;
    margin: 8px 0 16px;
  }
  .add-btn {
    background: #b5461a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .add-btn:active { transform: scale(0.98); }

  /* Cart overlay */
  #cart-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  #cart-overlay.open { display: flex; }
  #cart-panel {
    background: #fff;
    width: 100%;
    max-width: 420px;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    max-height: 80vh;
    overflow-y: auto;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  #cart-panel h2 {
    font-size: 1.1rem;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #close-cart {
    background: none;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    color: #6b5744;
  }
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f0e6d8;
  }
  .cart-item .name { font-size: 0.9rem; font-weight: 600; }
  .cart-item .qty-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qty-controls button {
    background: #f0e6d8;
    border: none;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
  }
  #cart-empty { text-align: center; color: #6b5744; padding: 20px 0; }
  #cart-total-row {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 2px solid #f0e6d8;
  }
  #checkout-btn {
    width: 100%;
    margin-top: 16px;
    background: #2f7d32;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  footer {
    text-align: center;
    color: #9a8a78;
    font-size: 0.75rem;
    padding: 30px 0 10px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Pati Dosa Batter</h1>
    <div class="tagline">Freshly ground, delivered daily</div>
  </div>
  <button id="cart-btn" onclick="openCart()">
    Cart
    <span id="cart-count">0</span>
  </button>
</header>

<main>
  <p class="intro">Traditional South Indian dosa batter, ground fresh every morning.</p>

  <div class="products" id="products"></div>
</main>

<footer>
  Endpoints: <code>/actuator/health</code> &middot; <code>/api/info</code>
</footer>

<div id="cart-overlay" onclick="if(event.target===this) closeCart()">
  <div id="cart-panel">
    <h2>Your cart <button id="close-cart" onclick="closeCart()">&times;</button></h2>
    <div id="cart-items"></div>
    <div id="cart-empty" style="display:none;">Your cart is empty.</div>
    <div id="cart-total-row">
      <span>Total</span>
      <span id="cart-total">Rs 0</span>
    </div>
    <button id="checkout-btn" onclick="checkout()">Checkout</button>
  </div>
</div>

<script>
  var products = [
    { id: 'half', name: '1/2 kg Dosa Batter', emoji: '\u{1F35E}', price: 60 },
    { id: 'full', name: '1 kg Dosa Batter', emoji: '\u{1F35E}', price: 110 }
  ];

  var cart = {}; // id -> qty

  function renderProducts() {
    var el = document.getElementById('products');
    el.innerHTML = products.map(function(p) {
      return '<div class="product-card">' +
        '<div class="emoji">' + p.emoji + '</div>' +
        '<h3>' + p.name + '</h3>' +
        '<div class="price">Rs ' + p.price + '</div>' +
        '<button class="add-btn" onclick="addToCart(\'' + p.id + '\')">Add to cart</button>' +
        '</div>';
    }).join('');
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    updateCartCount();
    renderCart();
    openCart();
  }

  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id] += delta;
    if (cart[id] <= 0) delete cart[id];
    updateCartCount();
    renderCart();
  }

  function updateCartCount() {
    var total = Object.values(cart).reduce(function(a, b) { return a + b; }, 0);
    document.getElementById('cart-count').textContent = total;
  }

  function renderCart() {
    var itemsEl = document.getElementById('cart-items');
    var emptyEl = document.getElementById('cart-empty');
    var ids = Object.keys(cart);

    if (ids.length === 0) {
      itemsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      document.getElementById('cart-total').textContent = 'Rs 0';
      return;
    }
    emptyEl.style.display = 'none';

    var total = 0;
    itemsEl.innerHTML = ids.map(function(id) {
      var p = products.find(function(x) { return x.id === id; });
      var qty = cart[id];
      var lineTotal = p.price * qty;
      total += lineTotal;
      return '<div class="cart-item">' +
        '<div><div class="name">' + p.name + '</div><div style="font-size:0.8rem;color:#6b5744;">Rs ' + p.price + ' each</div></div>' +
        '<div class="qty-controls">' +
          '<button onclick="changeQty(\'' + id + '\', -1)">-</button>' +
          '<span>' + qty + '</span>' +
          '<button onclick="changeQty(\'' + id + '\', 1)">+</button>' +
        '</div>' +
        '</div>';
    }).join('');

    document.getElementById('cart-total').textContent = 'Rs ' + total;
  }

  function openCart() {
    document.getElementById('cart-overlay').classList.add('open');
  }
  function closeCart() {
    document.getElementById('cart-overlay').classList.remove('open');
  }
  function checkout() {
    if (Object.keys(cart).length === 0) return;
    alert('This is a demo app \u2014 checkout is not connected to real payment processing.');
  }

  renderProducts();
  renderCart();
</script>

</body>
</html>
